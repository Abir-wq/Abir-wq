<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="320"
     viewBox="0 0 1200 320"
     role="img"
     aria-label="ABIR AHMED — Urban Planning, GIS, Remote Sensing, Geospatial Science">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- Bottom accent -->
  <rect y="312"
        width="1200"
        height="8"
        fill="#38bdf8"/>

  <!-- Decorative circles -->
  <circle cx="1080" cy="70" r="120"
          fill="#38bdf8"
          opacity="0.06"/>

  <circle cx="1120" cy="250" r="170"
          fill="#38bdf8"
          opacity="0.04"/>

  <!-- Name -->
  <text x="100"
        y="145"
        fill="#ffffff"
        font-family="Segoe UI, Roboto, Arial, sans-serif"
        font-size="70"
        font-weight="700"
        letter-spacing="1">
    ABIR AHMED
  </text>

  <!-- Designation -->
  <text x="104"
        y="205"
        fill="#cbd5e1"
        font-family="Segoe UI, Roboto, Arial, sans-serif"
        font-size="28"
        font-weight="500">
    Urban Planning • GIS • Remote Sensing
  </text>

  <text x="104"
        y="245"
        fill="#38bdf8"
        font-family="Segoe UI, Roboto, Arial, sans-serif"
        font-size="24"
        font-weight="500">
    Geospatial Science • Spatial Data • Environmental Research
  </text>

</svg>
