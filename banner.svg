<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="320"
     viewBox="0 0 1200 320">

  <defs>
    <linearGradient id="bg"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200"
        height="320"
        fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1080"
          cy="70"
          r="120"
          fill="#38bdf8"
          opacity="0.06"/>

  <circle cx="1120"
          cy="250"
          r="170"
          fill="#38bdf8"
          opacity="0.04"/>

  <circle cx="1000"
          cy="180"
          r="45"
          fill="none"
          stroke="#38bdf8"
          stroke-width="2"
          opacity="0.15"/>

  <!-- Name -->
  <text x="100"
        y="140"
        fill="#ffffff"
        font-family="Arial, Helvetica, sans-serif"
        font-size="68"
        font-weight="700"
        letter-spacing="2">
    ABIR AHMED
  </text>

  <!-- Main subtitle -->
  <text x="104"
        y="200"
        fill="#cbd5e1"
        font-family="Arial, Helvetica, sans-serif"
        font-size="27"
        font-weight="500">
    Urban Planning • GIS • Remote Sensing
  </text>

  <!-- Second subtitle -->
  <text x="104"
        y="242"
        fill="#38bdf8"
        font-family="Arial, Helvetica, sans-serif"
        font-size="23"
        font-weight="500">
    Geospatial Science • Spatial Data • Environmental Research
  </text>

  <!-- Bottom accent -->
  <rect x="0"
        y="312"
        width="1200"
        height="8"
        fill="#38bdf8"/>

</svg>
